<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack — CASINO DEMO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand"><span class="diamond">◆</span><div>CASINO DEMO<small>Blackjack</small></div></div>
    <div class="chip-bar">
      <button class="mute-btn" id="mute-btn" aria-label="Silenciar sonido">🔊</button>
      <div class="chip"><span class="coin"></span><span class="label">Fichas</span><span class="value" id="balance">-</span></div>
    </div>
  </header>

  <main class="page">
    <div class="game-panel">
      <h2>🃏 Blackjack</h2>
      <p class="hint">Acércate a 21 sin pasarte. El dealer se planta en 17. Blackjack natural paga 3:2.</p>

      <div class="table">
        <div class="hand-label">Dealer <span class="total" id="dealer-total">0</span></div>
        <div class="hand-cards" id="dealer-hand"></div>

        <div class="bet-zone">
          <div class="bet-stack" id="bet-stack"></div>
          <div class="bet-tag" id="bet-tag">Apuesta</div>
        </div>

        <div class="hand-label">Tú <span class="total" id="player-total">0</span></div>
        <div class="hand-cards" id="player-hand"></div>
      </div>

      <div class="field-row" style="justify-content:center; margin-bottom:16px;">
        <input class="field" type="number" id="bet" value="10" min="1" step="1" style="max-width:120px;" aria-label="Apuesta">
      </div>

      <div class="field-row" style="justify-content:center; margin-bottom:10px;">
        <button class="btn" id="deal-btn">Repartir</button>
        <button class="btn btn-ghost" id="double-btn" disabled>Doblar</button>
        <button class="btn btn-ghost" id="hit-btn" disabled>Pedir</button>
        <button class="btn btn-ghost" id="stand-btn" disabled>Plantarse</button>
      </div>

      <p class="result" id="result"></p>
      <p class="fair-badge" id="fair-badge">Provably fair desactivado hasta la primera mano</p>
      <a class="back-link" href="/">← Volver al lobby</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="diamonds">◆ ◆ ◆</div>
    <div><strong>CASINO DEMO</strong> — demo de entretenimiento con fichas virtuales.</div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/sfx.js"></script>
  <script>
    let player = [];
    let dealer = [];
    let roundId = null;

    const isRed = (s) => s === "♥" || s === "♦";
    function cardHTML(c, i, faceDown) {
      if (faceDown) return `<div class="card" style="animation-delay:${(i || 0) * 0.13}s"><span class="corner">🂠</span><span class="center-suit">▣</span></div>`;
      const red = isRed(c.suit) ? " red" : "";
      return `<div class="card${red}" style="animation-delay:${(i || 0) * 0.13}s"><span class="corner">${c.rank}<br>${c.suit}</span><span class="center-suit">${c.suit}</span></div>`;
    }
    function handTotal(hand) {
      let total = hand.reduce((s, c) => s + c.value, 0);
      let aces = hand.filter((c) => c.rank === "A").length;
      while (total > 21 && aces) { total -= 10; aces--; }
      return total;
    }
    function render(hideDealerHole) {
      const dEl = document.getElementById("dealer-hand");
      const pEl = document.getElementById("player-hand");
      pEl.innerHTML = player.map((c, i) => cardHTML(c, i)).join("");
      let dh = dealer.map((c, i) => cardHTML(c, i)).slice();
      if (hideDealerHole && dh.length) dh[dh.length - 1] = cardHTML(null, dealer.length - 1, true);
      dEl.innerHTML = dh.join("");
      document.getElementById("player-total").textContent = handTotal(player);
      document.getElementById("dealer-total").textContent = hideDealerHole && dealer.length ? handTotal(dealer.slice(0, -1)) : handTotal(dealer);
    }
    function renderBetStack() {
      const bet = parseFloat(document.getElementById("bet").value) || 0;
      const stack = document.getElementById("bet-stack");
      const tag = document.getElementById("bet-tag");
      const chips = Math.min(6, Math.max(1, Math.round(bet / 10)));
      stack.innerHTML = "";
      for (let i = 0; i < chips; i++) {
        const c = document.createElement("div");
        c.className = "bet-chip";
        c.style.zIndex = i;
        c.style.transform = `translate(${(i % 3) * 4 - 2}px, ${-i * 3}px)`;
        c.textContent = bet;
        stack.appendChild(c);
      }
      tag.textContent = bet ? `Apuesta: ${bet}` : "Apuesta";
    }
    function setActing(canAct, canDeal = false) {
      document.getElementById("deal-btn").disabled = !canDeal;
      document.getElementById("hit-btn").disabled = !canAct;
      document.getElementById("stand-btn").disabled = !canAct;
      document.getElementById("double-btn").disabled = !canAct || player.length !== 2;
    }
    function showResult(res, bet) {
      const el = document.getElementById("result");
      if (!res) { el.className = "result"; el.textContent = ""; return; }
      const net = (res.payout || 0) - bet;
      const map = {
        blackjack: ["win", `¡Blackjack! +${net} fichas (3:2)`],
        win: ["win", `¡Ganaste +${net} fichas!`],
        push: ["push", "Empate — recuperas tu apuesta"],
        bust: ["lose", "Te pasaste de 21"],
        lose: ["lose", "El dealer gana"],
      };
      const [cls, msg] = map[res.outcome] || ["lose", "Fin de mano"];
      el.className = `result ${cls}`;
      el.textContent = msg;
      if (cls === "win" && res.outcome !== "blackjack") { confetti(120); showToast(`+${net} fichas`); }
      if (cls === "win" && res.outcome === "blackjack") { confetti(160); showToast(`+${net} fichas (blackjack)`); }
    }

    async function deal() {
      const bet = parseFloat(document.getElementById("bet").value);
      if (!(bet >= 1)) return alert("Apuesta inválida");
      try {
        const data = await api("/api/games/blackjack/start", { method: "POST", body: JSON.stringify({ bet }) });
        player = data.player;
        dealer = data.dealer;
        roundId = data.round_id;
        showResult(data.result, bet);
        setChips(data.chips);
        renderFair(data);
        if (data.result) {
          render(false);
          setActing(false, true);
        } else {
          render(true);
          setActing(true, false);
        }
        sfxChip();
        setTimeout(() => { sfxCard(); sfxCard(); sfxCard(); }, 160);
      } catch (e) {
        showResult({ outcome: "lose" }, 0);
        document.getElementById("result").textContent = e.message;
        setActing(false, true);
      }
    }

    async function act(action) {
      if (!roundId) return;
      try {
        const data = await api("/api/games/blackjack/action", {
          method: "POST",
          body: JSON.stringify({ round_id: roundId, action }),
        });
        player = data.player;
        dealer = data.dealer;
        const bet = parseFloat(document.getElementById("bet").value);
        if (data.result) {
          render(false);
          showResult(data.result, action === "double" ? bet * 2 : bet);
          setChips(data.chips);
          setActing(false, true);
        } else {
          render(true);
          setActing(true, false);
        }
      } catch (e) {
        document.getElementById("result").className = "result lose";
        document.getElementById("result").textContent = e.message;
      }
    }

    document.getElementById("deal-btn").addEventListener("click", deal);
    document.getElementById("hit-btn").addEventListener("click", () => act("hit"));
    document.getElementById("stand-btn").addEventListener("click", () => act("stand"));
    document.getElementById("double-btn").addEventListener("click", () => act("double"));
    document.getElementById("bet").addEventListener("input", renderBetStack);
    renderBetStack();
  </script>
</body>
</html>
