<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta - Casino Demo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>🎡 Ruleta</h1>
    <div>Fichas: <span id="balance">-</span></div>
  </header>
  <main>
    <div id="wheel"><span id="num">0</span></div>
    <input type="number" id="bet" value="10" min="1" step="1">
    <select id="bet-type">
      <option value="red">Rojo</option>
      <option value="black">Negro</option>
      <option value="even">Par</option>
      <option value="odd">Impar</option>
      <option value="low">1-18</option>
      <option value="high">19-36</option>
      <option value="straight">Número exacto</option>
    </select>
    <input type="number" id="number" placeholder="Número (0-36)" hidden>
    <button id="spin-btn">Girar</button>
    <p id="result-text"></p>
    <a href="/">← Volver al lobby</a>
  </main>
  <script src="/js/app.js"></script>
  <script>
    const betType = document.getElementById("bet-type");
    const numInput = document.getElementById("number");
    betType.addEventListener("change", () => { numInput.hidden = betType.value !== "straight"; });
    document.getElementById("spin-btn").addEventListener("click", async () => {
      const bet = parseFloat(document.getElementById("bet").value);
      const bt = betType.value;
      const query = bt === "straight" ? `?bet_type=${bt}&number=${numInput.value}` : `?bet_type=${bt}`;
      const data = await api(`/api/games/roulette/play${query}`, { method: "POST", body: JSON.stringify({ bet }) });
      document.getElementById("num").textContent = data.result.number;
      document.getElementById("result-text").textContent = data.result.won ? `¡Ganaste +${data.result.payout - bet}!` : "Perdiste";
      setChips(data.chips);
    });
  </script>
</body>
</html>
