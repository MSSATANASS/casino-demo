<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slots - Casino Demo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>🎰 Slots</h1>
    <div>Fichas: <span id="balance">-</span></div>
  </header>
  <main>
    <div class="reels" id="reels">
      <span class="slot">?</span><span class="slot">?</span><span class="slot">?</span><br>
      <span class="slot">?</span><span class="slot">?</span><span class="slot">?</span><br>
      <span class="slot">?</span><span class="slot">?</span><span class="slot">?</span>
    </div>
    <input type="number" id="bet" value="10" min="1" step="1">
    <button id="spin-btn">Girar</button>
    <p id="result"></p>
    <a href="/">← Volver al lobby</a>
  </main>
  <script src="/js/app.js"></script>
  <script>
    const spinBtn = document.getElementById("spin-btn");
    async function spin() {
      const bet = parseFloat(document.getElementById("bet").value);
      spinBtn.disabled = true;
      const data = await api("/api/games/slots/play", { method: "POST", body: JSON.stringify({ bet }) });
      const reels = data.result.reels;
      document.getElementById("reels").innerHTML = reels.flat().map((s) => `<span class="slot">${s}</span>`).join("");
      setChips(data.chips);
      const gain = data.result.payout - bet;
      document.getElementById("result").textContent = gain >= 0 ? `+${gain} fichas` : `${gain} fichas`;
      spinBtn.disabled = false;
    }
    spinBtn.addEventListener("click", spin);
  </script>
</body>
</html>
