services:
  - type: web
    name: casino-demo
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////data/casino.db
      - key: BONUS_CHIPS
        value: "100"
    disk:
      name: data
      mountPath: /data
      sizeGB: 5
